// Almanac is one mod in one jar, built from modules (docs/ARCHITECTURE.md, "Modules"):
//   api   the public API (com.thenathe.almanac.api) and the internal API the modules talk through
//   core  everything that isn't a module of its own; implements the internal API and builds the jar
//   snow  the snow engine; compiles against api only
//   weather  regional weather: the storms, the wind and their record; compiles against api only
// core merges the three into build/libs/almanac-<version>.jar, with the one mod id almanac.
plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version '1.17.20' apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    // Every subproject's main source set sees only the Minecraft classes a dedicated server has; client code lives
    // in a client source set (core's src/client), which can see main but not the other way round.
    loom {
        splitEnvironmentSourceSets()
    }

    version = rootProject.property('mod_version')
    group = 'com.thenathe'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.terraformersmc.com/releases/' }
    }

    dependencies {
        minecraft 'com.mojang:minecraft:26.3'
        implementation 'net.fabricmc:fabric-loader:0.19.5'
        implementation 'net.fabricmc.fabric-api:fabric-api:0.165.2+26.3'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        options.compilerArgs << '-Xlint:deprecation'
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}
